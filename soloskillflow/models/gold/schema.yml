version: 2

models:
  - name: dim_users
    description: "One row per user: attributes, signup cohort (week), acquisition channel and A/B group."
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: fct_payments
    description: "One row per payment, all amounts converted to USD using daily NBU rates."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: amount_usd
        data_tests: [not_null]

  - name: fct_subscriptions
    description: "One row per subscription: trial outcome, revenue in USD and monthly value for MRR."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "trial_status <> 'converted' or converted_at is not null"
          config:
            severity: warn
    columns:
      - name: subscription_id
        data_tests: [unique, not_null]

  - name: fct_user_activity
    description: "One row per user per active day. Base for DAU/WAU/MAU, stickiness and retention."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, activity_date]
    columns:
      - name: days_since_signup
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_funnel
    description: "One row per user with first timestamp of each of 7 funnel steps. Activation = first completed lesson. has_invalid_ttfv marks users whose lesson events are dated before signup."
    data_tests:
      # тест на СИРІ дані: скільки уроків завершено раніше за реєстрацію
      - dbt_utils.expression_is_true:
          arguments:
            expression: "lesson_completed_at IS NULL OR lesson_completed_at >= signup_at"
          config:
            severity: warn
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: has_invalid_ttfv
        data_tests: [not_null]

  - name: fct_marketing
    description: "Daily marketing spend by channel and country joined with signups and paying users. Base for CAC."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [spend_date, channel, country]

  - name: fct_experiment
    description: "One row per A/B participant (conflicting assignments and test accounts excluded). Outcomes count only after assigned_at, with event_time_tolerance_hours for the known event-time shift."
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: experiment_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B']

  - name: fct_experiment_results
    description: "A/B test summary: lift and 95% CI per metric, result = better / worse / no difference."
    columns:
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ['better', 'worse', 'no difference']
  
  - name: fct_retention
    description: "Weekly signup cohorts with D1/D7/D14 retention. D30 not measurable (see docs/data_quality.md)."

  - name: fct_funnel_steps
    description: "Strict funnel in long format: one row per user per reached step. A step counts only if all previous steps were reached. Test accounts excluded."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, step_order]
    
  - name: fct_retention_curve
    description: "Retention curve: % of users active on day N after signup (N = 0..20), denominator = users whose day N is already observable. Activity data ends at day 21 after signup."
    columns:
      - name: day_n
        data_tests: [unique, not_null]
      - name: retention_pct
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: fct_mrr_daily
    description: "Daily MRR by plan. Each successful payment covers 30/90/365 days (monthly/quarterly/annual); a refund ends coverage. Annual = price / 12, quarterly = price / 3. Test accounts excluded."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [mrr_date, plan]

  - name: fct_user_revenue
    description: "One row per user with lifetime net revenue in USD (refunds subtracted). Base for ARPU / ARPPU and unit economics by channel."
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: dim_plans
    description: "Subscription plans: months (for MRR) and coverage days per payment. Source: seeds/plans.csv."
    columns:
      - name: plan
        data_tests: [unique, not_null]
  
  - name: dim_date
    description: "Calendar dimension: one row per day between vars dim_date_start and dim_date_end. Weeks start on Monday."
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_channels
    description: "Acquisition channels with is_paid flag (Organic = free). Source: seeds/channels.csv."
    columns:
      - name: channel
        data_tests: [unique, not_null]
      - name: is_paid
        data_tests: [not_null]

  - name: dim_countries
    description: "Countries with ISO code, built from seeds/country_aliases.csv."
    columns:
      - name: country
        data_tests: [unique, not_null]
      - name: country_code
        data_tests: [unique, not_null]