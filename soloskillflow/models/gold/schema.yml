version: 2

models:
  - name: dim_users
    description: "One row per user: attributes, signup cohort (week), acquisition channel and A/B group."
    columns:
      - name: user_id
        data_tests: [unique, not_null]

  - name: fct_payments
    description: "One row per payment, all amounts converted to USD using daily NBU rates."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: amount_usd
        data_tests: [not_null]

  - name: fct_subscriptions
    description: "One row per subscription: trial outcome, revenue in USD and monthly value for MRR."
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "trial_status <> 'converted' or converted_at is not null"
          config:
            severity: warn
    columns:
      - name: subscription_id
        data_tests: [unique, not_null]

  - name: fct_user_activity
    description: "One row per user per active day. Base for DAU/WAU/MAU, stickiness and retention."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, activity_date]
    columns:
      - name: days_since_signup
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: dim_plans
    description: "Subscription plans: months (for MRR) and coverage days per payment. Source: seeds/plans.csv."
    columns:
      - name: plan
        data_tests: [unique, not_null]
  
  - name: dim_date
    description: "Calendar dimension: one row per day between vars dim_date_start and dim_date_end. Weeks start on Monday."
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_channels
    description: "Acquisition channels with is_paid flag (Organic = free). Source: seeds/channels.csv."
    columns:
      - name: channel
        data_tests: [unique, not_null]
      - name: is_paid
        data_tests: [not_null]

  - name: dim_countries
    description: "Countries with ISO code, built from seeds/country_aliases.csv."
    columns:
      - name: country
        data_tests: [unique, not_null]
      - name: country_code
        data_tests: [unique, not_null]

  - name: dim_experiment_assignments
    description: "Bridge between users and experiments: one row per user per experiment (group, assignment time, conflict flag). Keeps experiment attributes out of dim_users to avoid fan-out."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [experiment_id, user_id]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: experiment_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B']

  - name: fct_marketing_spend
    description: "Fact: daily marketing spend. Grain = spend_date × channel × country. Keys and measures only; attributes live in dim_channels / dim_countries. Negative spend is NULL with is_negative_spend flag."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [spend_date, channel, country]
    columns:
      - name: spend_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: channel
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_channels')
                field: channel
      - name: country
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_countries')
                field: country

  - name: fct_app_errors
    description: "Fact: one row per app error. Orphan user_ids are known (see silver tests)."
    columns:
      - name: error_id
        data_tests: [unique, not_null]

  - name: fct_support_tickets
    description: "Fact: one row per support ticket."
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]