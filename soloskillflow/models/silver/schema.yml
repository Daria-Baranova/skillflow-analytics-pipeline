version: 2

models:
  - name: stg_users
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: signup_at
        data_tests: [not_null]
      - name: country
        data_tests: 
          - accepted_values:
              arguments:
                values: ['Ukraine', 'Poland', 'Germany', 'United States', 'Spain', 'Czechia', 'Canada']
      - name: device
        data_tests: 
          - accepted_values:
              arguments:
                values: ['mobile', 'desktop', 'tablet']
      - name: traffic_source
        data_tests:
          - accepted_values:
              arguments:
                values: ['Organic', 'Paid Social', 'Google Ads', 'Referral', 'Email']  
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: amount
        data_tests: [not_null]
      - name: currency_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'UAH', 'EUR']
      - name: subscription_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id

  - name: stg_subscriptions
    columns: 
      - name: subscription_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests: 
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
      - name: plan
        data_tests:
          - accepted_values:
              arguments:
                values: ['monthly', 'quarterly', 'annual']
      - name: trial_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'converted', 'cancelled'] 

  - name: stg_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: user_id
        data_tests: [not_null]
      - name: platform
        data_tests:
          - accepted_values:
              arguments:
                values: ['web', 'ios', 'android']
      - name: event_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['signup', 
                         'onboarding_started', 'onboarding_step_completed', 'onboarding_completed',
                         'paywall_viewed', 
                         'trial_activated', 
                         'lesson_started', 'lesson_completed', 
                         'quiz_completed']
  - name: stg_experiments
    columns:
      - name: user_id
        data_tests: [unique, not_null]
      - name: experiment_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B']

  - name: stg_lessons
    columns:
      - name: lesson_id
        data_tests: [unique, not_null]
  
  - name: stg_lesson_progress
    columns:
      - name: progress_id
        data_tests: [unique, not_null]
      - name: lesson_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_lessons')
                field: lesson_id
              config:
                severity: warn
  
  - name: stg_app_errors
    columns:
      - name: error_id
        data_tests: [unique, not_null]
      - name: error_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['ERR_SYNC', 'ERR_RENDER', 'ERR_TIMEOUT', 'ERR_VALIDATION', 'ERR_PAYMENT']
      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id
              config:
                severity: warn
  
  - name: stg_support_tickets
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ['onboarding', 'account', 'billing', 'content', 'technical']

  - name: stg_marketing_spend
    columns:
      - name: channel
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Organic', 'Paid Social', 'Google Ads', 'Referral', 'Email']
  
  - name: stg_nbu_rates
    columns:
      - name: currency_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'EUR']