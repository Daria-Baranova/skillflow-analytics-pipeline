
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'soloskillflow'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'soloskillflow'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# права на читання схем для BI: виконується наприкінці кожного запуску dbt
on-run-end:
  - "GRANT USAGE ON SCHEMA gold TO superset_reader"
  - "GRANT USAGE ON SCHEMA marts TO superset_reader"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  soloskillflow:
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table
      +grants:
        select: ['superset_reader']
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      +contract:
        enforced: true
      +grants:
        select: ['superset_reader']
seeds:
  soloskillflow:
    +schema: silver   # довідники лежать поруч з очищеними даними
vars:
  reporting_tz: 'Europe/Kyiv'   # бізнес-часовий пояс: межі днів і тижнів, дата курсу НБУ
  event_time_tolerance_hours: 3   # допуск на відомий зсув часу подій (~2% подій мають −3h)
  ab_z_primary: 1.96      # 95% CI для primary-метрики
  ab_z_corrected: 2.64    # Бонферроні: 5% / 6 інших метрик → 99.17% CI
  dim_date_start: '2026-01-01'   # календар: перший день (включно)
  dim_date_end: '2027-01-01'     # календар: межа (не включно)
  main_experiment_id: 'EXP_2026_06_ONBOARDING_PLAN'   # експеримент, групу якого показує дашборд