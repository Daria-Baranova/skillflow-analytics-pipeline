    id: MARKDOWN-BRdYpwkNhpre3UPfhLDFP
    meta:
      code: "\n## SkillFlow \u2014 product health at a glance\n**Period:** signups\
        \ Jun 1 \u2013 Jul 1 2026, activity until Jul 22 2026 \xB7 test accounts excluded\n\
        \n**How to read:** each card answers one business question. \U0001F7E2 green\
        \ = at or above benchmark \xB7 \U0001F534 red = below benchmark \xB7 no colour\
        \ = no benchmark. Details are on the next tabs.\n\n**Key takeaway:** users\
        \ rarely start a trial after the paywall (16%) and only 7.5% return on day\
        \ 1 \u2014 the first-session experience is the main problem.\n\n**Filters**\
        \ (left panel): Channel and Experiment group apply to user-level charts only;\
        \ cohort, MRR, retention and experiment summaries are pre-aggregated and show\
        \ totals."
      height: 25
      width: 12
