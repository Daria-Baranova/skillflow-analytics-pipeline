  MARKDOWN-TohD8z72b7Q30hFF1jMxx:
    children: []
    id: MARKDOWN-TohD8z72b7Q30hFF1jMxx
    meta:
      code: "## Glossary \u2014 what every metric means\r\n\r\nAll metrics: test accounts\
        \ excluded \xB7 amounts in USD (UAH/EUR converted with daily NBU rates) \xB7\
        \ signups Jun 1 \u2013 Jul 1 2026.\r\n\r\n### Acquisition \u2014 do people\
        \ come, and at what cost?\r\n| Metric | Formula | Answers the question | Benchmark\
        \ |\r\n|---|---|---|---|\r\n| **Signups** | count of new users | How many\
        \ people did we attract? Volume alone is a vanity metric \u2014 read with\
        \ CAC and activation | \u2014 |\r\n| **CAC per signup** | marketing spend\
        \ \xF7 signups | How much does one new user cost? | \u2014 |\r\n| **CAC per\
        \ paying customer** | marketing spend \xF7 paying customers | How much does\
        \ one paying customer cost? Budget decisions by channel | \u2264 1 year of\
        \ revenue (~$100); LTV : CAC \u2265 3 : 1 |\r\n\r\n### Activation \u2014 did\
        \ the user get value?\r\n| Metric | Formula | Answers the question | Benchmark\
        \ |\r\n|---|---|---|---|\r\n| **Activation Rate** | users with 1st completed\
        \ lesson \xF7 signups | Did the user reach the aha-moment? Strongest early\
        \ (leading) signal of retention | 20\u201340% (edtech) |\r\n| **Time to First\
        \ Value** | median hours from signup to 1st completed lesson | How fast do\
        \ users see value? Longer = more drop-off before value | < 48 h |\r\n| **Funnel**\
        \ | users on each step, strict (all previous steps reached); % = from previous\
        \ step | Where exactly do we lose users? Fix the biggest leak first | \u2014\
        \ |\r\n\r\n### Engagement & Retention \u2014 does it become a habit?\r\n|\
        \ Metric | Formula | Answers the question | Benchmark |\r\n|---|---|---|---|\r\
        \n| **DAU / MAU** | unique active users per day / per month | How big is the\
        \ living audience? | \u2014 |\r\n| **Stickiness** | average DAU \xF7 MAU |\
        \ How many days a month is the product used? | 10\u201320% typical, 20%+ good\
        \ |\r\n| **D1 / D7 / D14 retention** | active on day N after signup \xF7 users\
        \ who reached day N | Do users come back? D1 = first experience, D7 = habit\
        \ forming | D1 25\u201340% (edtech) |\r\n| **Retention curve** | retention\
        \ by day N | A flat \"shelf\" = loyal core exists (sign of product-market\
        \ fit) | flattening curve |\r\n\r\n### Conversion & Revenue \u2014 do users\
        \ pay, and is it enough?\r\n| Metric | Formula | Answers the question | Benchmark\
        \ |\r\n|---|---|---|---|\r\n| **Trial \u2192 Paid** | converted \xF7 finished\
        \ trials (active trials excluded) | Do users see enough value in 7 days to\
        \ pay? | 40\u201360% (card-required trial) |\r\n| **MRR** | sum of monthly\
        \ value of active subscriptions (annual \xF7 12, quarterly \xF7 3) | Is recurring\
        \ revenue growing? Main health metric of a subscription business | growing\
        \ |\r\n| **ARPU** | net revenue \xF7 all users | How much does an average\
        \ user bring? Compare with CAC per signup | > CAC per signup |\r\n| **ARPPU**\
        \ | net revenue \xF7 paying users | How much does a payer bring? Pricing decisions\
        \ | \u2014 |\r\n| **Paying share** | paying users \xF7 all users (= ARPU \xF7\
        \ ARPPU) | How many users ever pay? | \u2014 |\r\n| **Refund rate** | refunds\
        \ \xF7 successful payments | Does the paywall promise more than the product\
        \ gives? | < 5% |\r\n\r\n### Experiment \u2014 did the change really work?\r\
        \n| Term | Meaning |\r\n|---|---|\r\n| **Primary metric** | the one metric\
        \ the change was made for; chosen *before* the test |\r\n| **Secondary metrics**\
        \ | supporting metrics that explain the result |\r\n| **Guardrails** | metrics\
        \ that must **not** get worse (errors, support tickets, onboarding completion)\
        \ |\r\n| **Lift** | relative difference (B \u2212 A) \xF7 A |\r\n| **95% CI**\
        \ | range of the true difference; if it does not cross 0 \u2014 the effect\
        \ is real |\r\n| **Rollout rule** | primary significantly better **and** no\
        \ guardrail significantly worse |\r\n\r\n### Common traps\r\n- **Wrong denominator**\
        \ \u2014 e.g. counting active trials as failures, or blended CAC including\
        \ free organic users.\r\n- **Average instead of median** for time and money\
        \ \u2014 a few outliers distort the average.\r\n- **Average of percentages**\
        \ \u2014 weight by cohort size instead.\r\n- **Incomplete period** \u2014\
        \ partial weeks/months look like drops.\r\n- **Correlation \u2260 causation**\
        \ \u2014 only an A/B test proves a change caused the effect."
      height: 148
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-10vK-7ZScPLQedBi_IC_g
    - TAB-btkjCMvvCXdN_QwVxxbzh
    - ROW-aVf2C1aiErhZd3qOIwWRW
    type: MARKDOWN
  MARKDOWN-lvEgO3Oz2LDdV8cj5NTN_:
    children: []
    id: MARKDOWN-lvEgO3Oz2LDdV8cj5NTN_
    meta:
      code: "### Does the business make money \u2014 and does it pay back?\r\n\r\n\
        **Is recurring revenue growing?** \u2014 MRR peaked at **$17.4k on Jul 8**\
        \ and is now declining: signups stopped on Jul 1, so fewer new subscriptions\
        \ arrive than lapse.\r\n\r\n**Which plans drive MRR?** \u2014 monthly / quarterly\
        \ / annual contribution (annual counted as price \xF7 12).\r\n\r\n**How much\
        \ does a user bring?** \u2014 ARPU **$1.5** = ARPPU $30 \xD7 only **5%** paying\
        \ users. Money problem = too few payers, not the price.\r\n\r\n**Unit economics**\
        \ \u2014 ARPU is ~$1.5 in every channel, while CAC per signup is **$16\u2013\
        29** (see Acquisition): each paid signup returns 10\u201320\xD7 less than\
        \ it costs.\r\n\r\n*MRR: each payment covers 30/90/365 days; a refund ends\
        \ coverage. Data ends Jul 31, test accounts excluded.*"
      height: 33
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-10vK-7ZScPLQedBi_IC_g
    - TAB-TGygUZXnj9nIjEzP3AzZ0
    - ROW-6-zUEXhX7h4s-_dHmoNEK
    type: MARKDOWN
  MARKDOWN-vDrmUipFAuvJ-FEiK9sob:
    children: []
    id: MARKDOWN-vDrmUipFAuvJ-FEiK9sob
    meta:
      code: "### Where do we lose users \u2014 and why?\r\n\r\n**Where do we lose\
        \ users?** \u2014 strict funnel: a user counts on a step only if all previous\
        \ steps were reached. % under each step = conversion from the previous step.\
        \ \U0001F534 Biggest leak: **Paywall \u2192 Trial (16%)** \u2014 26k users\
        \ leave here.\r\n\r\n**Is it the traffic or the product?** \u2014 activation\
        \ is 13\u201314% in every channel, so the problem is the **product experience**,\
        \ not traffic quality.\r\n\r\n**How long until the first lesson?** \u2014\
        \ long tail: some users need 2\u20133 weeks. That's why Time to First Value\
        \ uses the **median**, not the average."
      height: 25
      width: 12
    parents:
