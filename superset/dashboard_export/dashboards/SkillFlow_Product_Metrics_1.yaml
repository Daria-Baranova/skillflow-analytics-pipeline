    id: MARKDOWN-9B21O-lWoTAGI-6V3EHTp
    meta:
      code: "### Where do users come from and what do they cost?\r\n\r\n**Which channels\
        \ bring new users?** \u2014 weekly signups by acquisition channel. Watch for\
        \ sudden drops in a channel (paused ads, broken tracking). *Last partial week\
        \ (Jun 29 \u2013 Jul 1) is excluded.*\r\n\r\n**Which channel is worth the\
        \ money?** \u2014 sorted from cheapest to most expensive paying customer.\
        \ \U0001F534 above $100 = customer does not pay back within a year (~$9/month)\
        \ \xB7 \U0001F7E2 $100 or less.\r\n\r\n*Organic has $0 spend, so its CAC is\
        \ 0. Spend data exists only for US, DE, UA, PL.*\r\n"
      height: 24
      width: 12
