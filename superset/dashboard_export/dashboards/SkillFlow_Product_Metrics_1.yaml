  MARKDOWN-Mz7udBP7l_IYSZIzNbfX8:
    children: []
    id: MARKDOWN-Mz7udBP7l_IYSZIzNbfX8
    meta:
      code: "### Should we roll out the new onboarding (group B)?\r\n\r\n**Experiment:**\
        \ EXP_2026_06_ONBOARDING_PLAN \xB7 A = current onboarding, B = new \xB7 ~20k\
        \ users per group \xB7 June 2026.\r\n\r\n**How to read:** \U0001F7E2 B significantly\
        \ better \xB7 \U0001F534 B significantly worse \xB7 \u26AA no significant\
        \ difference. *CI* = 95% confidence interval of the difference in percentage\
        \ points: if it does not cross 0, the effect is real.\r\n\r\n**Decision: \u274C\
        \ do not roll out as is.** B increases trial starts (+7%) and payments (+10%),\
        \ but all three guardrails got significantly worse: app errors +29%, support\
        \ tickets +16%, onboarding completion \u22121.1%. Errors grew on **all** screens\
        \ \u2192 likely a technical bug in the B build. Fix the bug, review onboarding/account\
        \ tickets, then re-run the test."
      height: 26
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - TABS-10vK-7ZScPLQedBi_IC_g
    - TAB-az-9qM3uA-lJNLTp0mAkK
    - ROW-7VDrw2F5hR06fMTM7YhxV
    type: MARKDOWN
  MARKDOWN-Nf0jn-NKkMsG96cczailZ:
    children: []
    id: MARKDOWN-Nf0jn-NKkMsG96cczailZ
    meta:
      code: "### Does the product become a habit?\r\n\r\n**Do users keep coming back?**\
        \ \u2014 % of users active on day N after signup. Drop to 7.5% on day 1, then\
        \ a flat **~3% shelf**: a small loyal core exists.\r\n\r\n**Are newer cohorts\
        \ retained better?** \u2014 all June cohorts look the same: no product improvement\
        \ during the month. \U0001F534 D1 below 25% benchmark.\r\n\r\n**Who is active\
        \ every day?** \u2014 most daily activity comes from **new signups**, not\
        \ returning users: DAU is driven by marketing, not by habit.\r\n\r\n**How\
        \ sticky is the product?** \u2014 4.8%: an average user is active less than\
        \ 1.5 days a month.\r\n\r\n*Data limits: activity is tracked up to day 21\
        \ after signup; no signups after Jul 1, so July is excluded from DAU and stickiness.*\
        \ *Cohort of Jun 29 covers only 3 days of signups.*"
      height: 32
      width: 12
