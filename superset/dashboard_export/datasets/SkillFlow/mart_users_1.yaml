metrics:
- metric_name: median_ttfv_hours
  verbose_name: Time to First Value, h (median)
  metric_type: null
  expression: PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY hours_to_first_value)
  description: Median hours from signup to first completed lesson. The longer it is,
    the more users drop off before seeing value.
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: activation_rate
  verbose_name: Activation Rate, %
  metric_type: null
  expression: ROUND(100.0 * COUNT(*) FILTER (WHERE is_activated) / NULLIF(COUNT(*),
    0), 1)
  description: "Share of new users who completed their first lesson (aha-moment).\
    \ Leading indicator of retention. Benchmark for edtech: 20\u201340%."
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: signups
  verbose_name: Signups
  metric_type: null
  expression: COUNT(*)
  description: "Number of new users who signed up, test accounts excluded. Volume\
    \ metric \u2014 always read together with CAC and activation."
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: paying_share
  verbose_name: Paying users, %
  metric_type: null
  expression: ROUND(100.0 * COUNT(*) FILTER (WHERE is_paying) / NULLIF(COUNT(*), 0),
    1)
  description: null
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: arpu
  verbose_name: ARPU, USD
  metric_type: null
  expression: ROUND(SUM(net_revenue_usd) / NULLIF(COUNT(*), 0), 2)
  description: null
  d3format: null
  currency: null
