metrics:
- metric_name: stickiness
  verbose_name: Stickiness (DAU/MAU), %
  metric_type: null
  expression: ROUND(100.0 * COUNT(*) FILTER (WHERE NOT is_test_account) / NULLIF(COUNT(DISTINCT
    activity_date), 0) / NULLIF(COUNT(DISTINCT user_id) FILTER (WHERE NOT is_test_account),
    0), 1)
  description: "Average DAU divided by unique users active in the selected period.\
    \ Shows how many days per month the product is used. 10\u201320% is typical, 20%+\
    \ is good."
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: dau
  verbose_name: Active users
  metric_type: null
  expression: COUNT(DISTINCT user_id) FILTER (WHERE NOT is_test_account)
  description: Unique active users in the period (per day on a daily chart = DAU).
  d3format: null
  currency: null
  extra: {}
