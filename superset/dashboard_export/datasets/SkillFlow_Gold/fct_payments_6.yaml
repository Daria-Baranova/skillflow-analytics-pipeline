metrics:
- metric_name: refund_rate
  verbose_name: Refund rate, %v
  metric_type: null
  expression: ROUND(100.0 * COUNT(*) FILTER (WHERE is_refund AND NOT is_test_account)
    / NULLIF(COUNT(*) FILTER (WHERE NOT is_refund AND NOT is_test_account), 0), 1)
  description: Refunds as % of successful payments. Growth = paywall promises more
    than the product gives.
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: arppu
  verbose_name: ARPPU, USD
  metric_type: null
  expression: ROUND(SUM(amount_usd) FILTER (WHERE NOT is_test_account) / NULLIF(COUNT(DISTINCT
    user_id) FILTER (WHERE NOT is_test_account), 0), 2)
  description: Average revenue per paying user (net of refunds, in USD). Shows how
    much a paying customer brings; used for pricing decisions.
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
