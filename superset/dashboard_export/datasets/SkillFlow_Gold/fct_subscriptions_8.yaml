metrics:
- metric_name: trial_to_paid
  verbose_name: "Trial \u2192 Paid, %"
  metric_type: null
  expression: ROUND(100.0 * COUNT(*) FILTER (WHERE is_converted AND NOT is_test_account)
    / NULLIF(COUNT(*) FILTER (WHERE is_trial_finished AND NOT is_test_account), 0),
    1)
  description: Share of finished trials that converted to a paid subscription. Active
    trials are excluded because their outcome is not known yet. Shows if users see
    enough value in 7 days to pay.
