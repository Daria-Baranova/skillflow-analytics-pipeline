metrics:
- metric_name: cac_paying
  verbose_name: CAC per paying customer, USD
  metric_type: null
  expression: ROUND(SUM(spend_usd) / NULLIF(SUM(paying_users), 0), 0)
  description: "Marketing spend divided by paying customers acquired. Compare with\
    \ revenue per customer: healthy business needs LTV : CAC \u2265 3 : 1."
  d3format: null
  currency: null
  extra:
    warning_markdown: ''
  warning_text: null
- metric_name: cac_signup
  verbose_name: CAC per signup, USD
  metric_type: null
  expression: ROUND(SUM(spend_usd) / NULLIF(SUM(signups), 0), 2)
  description: "Spend per new user. Cheap signups are useless if they never pay \u2014\
    \ read with CAC per paying customer."
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: mkt_signups
  verbose_name: Signups (paid-tracked)
  metric_type: null
  expression: SUM(signups)
  description: Signups in countries with marketing spend data (US, DE, UA, PL).
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: paying_users
  verbose_name: Paying users
  metric_type: null
  expression: SUM(paying_users)
