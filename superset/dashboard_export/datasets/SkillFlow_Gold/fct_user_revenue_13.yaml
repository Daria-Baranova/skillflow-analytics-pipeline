metrics:
- metric_name: paying_share
  verbose_name: Paying users, %
  metric_type: null
  expression: ROUND(100.0 * COUNT(*) FILTER (WHERE is_paying AND NOT is_test_account)
    / NULLIF(COUNT(*) FILTER (WHERE NOT is_test_account), 0), 1)
  description: "Share of registered users who paid at least once. ARPU = ARPPU \xD7\
    \ paying share."
  d3format: null
  currency: null
  extra: {}
  warning_text: null
- metric_name: arpu
  verbose_name: ARPU, USD
  metric_type: null
  expression: ROUND(SUM(net_revenue_usd) FILTER (WHERE NOT is_test_account) / NULLIF(COUNT(*)
    FILTER (WHERE NOT is_test_account), 0), 2)
  description: Net revenue per registered user (paying or not). Compare with CAC per
    signup.
  d3format: null
  currency: null
  extra: {}
  warning_text: null
